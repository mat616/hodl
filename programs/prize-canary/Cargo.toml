[package]
name = "prize-canary"
version = "0.1.0"
description = "Capped prize vault: on-chain weights, 95/4.5/0.5 split, published TWAB root"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "prize_canary"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
